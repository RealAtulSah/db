<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DB File Explorer - Open, inspect, query, edit and export SQLite database files directly in your browser. No installation or server required.">
  <title>DB File Explorer</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23FFD600' stroke-width='2'><ellipse cx='12' cy='5' rx='9' ry='3'/><path d='M21 12c0 1.66-4 3-9 3s-9-1.34-9-3'/><path d='M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5'/></svg>">
</head>
<body>
  <div id="app">
    <!-- Loading state while SQL.js initialises -->
    <div class="loader" style="height:100vh;">
      <div class="loader__spinner"></div>
      <div class="loader__text">Initialising DB File Explorer...</div>
    </div>
  </div>

  <!-- Libraries (bundled locally) -->
  <script src="lib/sql-wasm.js"></script>
  <script src="lib/xlsx.full.min.js"></script>

  <!-- Application modules (order matters: dependencies first) -->
  <script src="js/notifications.js"></script>
  <script src="js/detector.js"></script>
  <script src="js/database.js"></script>
  <script src="js/export-manager.js"></script>
  <script src="js/search-filter.js"></script>
  <script src="js/record-editor.js"></script>
  <script src="js/table-view.js"></script>
  <script src="js/query-editor.js"></script>
  <script src="js/app.js"></script>

  <script>
    // Bootstrap
    (async function() {
      try {
        // SQL.js exposes initSqlJs globally
        initSqlJs_loader = initSqlJs;
        await App.init();
      } catch (e) {
        console.error('Failed to initialise DB File Explorer:', e);
        document.getElementById('app').innerHTML = `
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;text-align:center;padding:2rem;">
            <h1 style="font-size:1.5rem;margin-bottom:1rem;">Failed to initialise</h1>
            <p style="color:#6B7280;max-width:400px;">${e.message || 'An unexpected error occurred. Please check the console for details.'}</p>
            <p style="color:#6B7280;font-size:0.75rem;margin-top:1rem;">Ensure that sql-wasm.js and sql-wasm.wasm are present in the lib/ directory.</p>
          </div>
        `;
      }
    })();
  </script>
</body>
</html>
